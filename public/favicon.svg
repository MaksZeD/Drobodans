<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Card back blue fill with rounded corners -->
  <rect x="2" y="0" width="28" height="32" rx="4" ry="4" fill="#1A3A5C"/>
  <!-- Gold border -->
  <rect x="3.5" y="1.5" width="25" height="29" rx="3" ry="3" fill="none" stroke="#C4A265" stroke-width="1.5"/>
  <!-- Inner border -->
  <rect x="5.5" y="3.5" width="21" height="25" rx="2" ry="2" fill="none" stroke="#C4A265" stroke-width="0.5"/>
  <!-- Diamond pattern -->
  <g fill="#C4A265" opacity="0.7">
    <polygon points="11,10 12.5,11.5 11,13 9.5,11.5"/>
    <polygon points="16,10 17.5,11.5 16,13 14.5,11.5"/>
    <polygon points="21,10 22.5,11.5 21,13 19.5,11.5"/>
    <polygon points="13.5,13 15,14.5 13.5,16 12,14.5"/>
    <polygon points="18.5,13 20,14.5 18.5,16 17,14.5"/>
    <polygon points="11,16 12.5,17.5 11,19 9.5,17.5"/>
    <polygon points="16,16 17.5,17.5 16,19 14.5,17.5"/>
    <polygon points="21,16 22.5,17.5 21,19 19.5,17.5"/>
    <polygon points="13.5,19 15,20.5 13.5,22 12,20.5"/>
    <polygon points="18.5,19 20,20.5 18.5,22 17,20.5"/>
  </g>
  <!-- Center D emblem -->
  <text x="16" y="18" font-family="serif" font-weight="bold" font-size="10" fill="#C4A265" text-anchor="middle" dominant-baseline="central">D</text>
</svg>
